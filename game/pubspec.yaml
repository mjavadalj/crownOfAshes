name: crown_of_ashes_game
description: Swipe-driven political narrative game runtime for Crown of Ashes.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.7.0
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: EBGaramond
      fonts:
        - asset: assets/fonts/EBGaramond.ttf
  assets:
    - assets/content/content.json
    - assets/cards/
